name: CI

# Corre los tests en cada push/PR a main, para detectar un cambio que rompa
# algo (login, CRUD de libros, categorías...) antes de que llegue a
# producción. Antes no había nada que lo comprobase automáticamente.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tests
        run: mvn -B test
