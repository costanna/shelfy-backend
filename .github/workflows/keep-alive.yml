name: Keep backend awake

# Render free duerme el servicio tras ~15 min sin tráfico (la siguiente petición
# puede tardar casi un minuto en responder). Este workflow HACÍA un ping cada 10
# minutos a /actuator/health para que no llegara a dormirse. Gratis: el repo es
# público, así que los minutos de GitHub Actions no tienen límite.
#
# DESACTIVADO (2026-10-15): no se quiere nada despert 24h. Solo queda el
# disparo manual (Actions → Keep backend awake → Run workflow) para despertar
# bajo demanda. Para reactivarlo, descomenta el bloque `schedule`.
on:
  # schedule:
  #   - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf --max-time 30 https://shelfy-backend-prw2.onrender.com/actuator/health \
            || echo "El ping ha fallado (puede que Render estuviera arrancando); no pasa nada, se reintenta en 10 min."
