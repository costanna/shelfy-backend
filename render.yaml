# Blueprint de Render para shelfy-backend.
#
# Uso: Render dashboard → New → Blueprint → conecta este repositorio.
# Crea el Web Service del backend. La base de datos NO se crea aquí: vive en
# Neon (u otro proveedor externo) porque el plan Free de Render solo permite
# una base de datos Postgres gestionada por cuenta, y esta cuenta ya tiene
# una en uso para otra cosa.
#
# DB_HOST/DB_NAME/DB_USER/DB_PASSWORD quedan como "sync: false": Render los
# pedirá al aplicar el Blueprint (o se rellenan luego a mano en Environment)
# con los datos de conexión que dé Neon. DB_PORT y DB_SSLMODE ya vienen con
# los valores que usa Neon por defecto.
#
# JWT_SECRET se genera solo (generateValue) la primera vez.
# CORS_ALLOWED_ORIGINS apunta al frontend desplegado en Vercel. Si cambia la
# URL (otro dominio, preview deploys, etc.), actualízala aquí.
services:
  - type: web
    name: shelfy-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://shelfy-frontend-six.vercel.app
      - key: DDL_AUTO
        value: update
