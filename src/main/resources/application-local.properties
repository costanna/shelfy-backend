# Perfil de desarrollo sin PostgreSQL: base de datos H2 en memoria.
# Uso:  mvn spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:mem:shelfy;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# Datos de ejemplo para poder probar la API nada más arrancar.
shelfy.seed.enabled=true
