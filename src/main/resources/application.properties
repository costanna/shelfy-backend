spring.application.name=shelfy-backend

# --- Base de datos (PostgreSQL) -------------------------------------------
# En Render se rellenan con variables de entorno del propio servicio.
# DB_URL tiene prioridad si se define entera; si no, se compone a partir de
# DB_HOST/DB_PORT/DB_NAME (así el render.yaml puede enlazar la base de datos
# sin que nadie tenga que copiar/pegar la connection string a mano).
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shelfy}}
spring.datasource.username=${DB_USER:shelfy}
spring.datasource.password=${DB_PASSWORD:shelfy}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate -------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${SHOW_SQL:false}

# --- Seguridad / JWT -------------------------------------------------------
# JWT_SECRET debe definirse en producción (mínimo 32 caracteres).
shelfy.jwt.secret=${JWT_SECRET:cambia-este-secreto-de-desarrollo-shelfy-32bytes}
shelfy.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ------------------------------------------------------------------
# En Render: CORS_ALLOWED_ORIGINS=https://shelfy-frontend.onrender.com
shelfy.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Servidor --------------------------------------------------------------
server.port=${PORT:8080}
server.error.include-message=always

# --- Actuator --------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
