spring.application.name=shelfy-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shelfy}?sslmode=${DB_SSLMODE:disable}}
spring.datasource.username=${DB_USER:shelfy}
spring.datasource.password=${DB_PASSWORD:shelfy}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${SHOW_SQL:false}

shelfy.jwt.secret=${JWT_SECRET:cambia-este-secreto-de-desarrollo-shelfy-32bytes}
shelfy.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

shelfy.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

shelfy.frontend-url=${FRONTEND_URL:http://localhost:4200}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
shelfy.mail.enabled=${MAIL_ENABLED:false}
shelfy.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@shelfy.app}}

server.port=${PORT:8080}
server.error.include-message=always

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
