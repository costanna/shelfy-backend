spring.application.name=shelfy-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shelfy}?sslmode=${DB_SSLMODE:disable}}
spring.datasource.username=${DB_USER:shelfy}
spring.datasource.password=${DB_PASSWORD:shelfy}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool pequeño a propósito: en el plan free de Render (poca RAM/CPU) y con el
# tráfico de una app personal, el valor por defecto de Hikari (10) reserva más
# memoria y conexiones de las que realmente se usan a la vez.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${SHOW_SQL:false}

shelfy.jwt.secret=${JWT_SECRET:cambia-este-secreto-de-desarrollo-shelfy-32bytes}
shelfy.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

shelfy.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

shelfy.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Email transaccional vía la API HTTP de Resend (https://resend.com), no SMTP:
# Render bloquea los puertos SMTP salientes (25/465/587) en su plan free desde
# sep-2025 y el corte es silencioso, así que un SMTP directo se queda colgado
# en vez de fallar. La API de Resend solo usa HTTPS (443), que sí funciona.
#
# shelfy.mail.from debe ser una dirección de un dominio verificado en Resend.
# Sin verificar un dominio propio, Resend solo deja usar su remitente de
# pruebas "onboarding@resend.dev", y con ese remitente de pruebas SOLO entrega
# al email con el que te registraste en Resend (no a usuarios reales) — hace
# falta verificar un dominio propio en el panel de Resend para enviar a
# cualquier destinatario.
shelfy.mail.resend-api-key=${RESEND_API_KEY:}
shelfy.mail.enabled=${MAIL_ENABLED:false}
shelfy.mail.from=${MAIL_FROM:onboarding@resend.dev}

shelfy.registration.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:false}

server.port=${PORT:8080}
server.error.include-message=always

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
