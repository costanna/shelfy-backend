spring.application.name=shelfy-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shelfy}?sslmode=${DB_SSLMODE:disable}}
spring.datasource.username=${DB_USER:shelfy}
spring.datasource.password=${DB_PASSWORD:shelfy}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${SHOW_SQL:false}

shelfy.jwt.secret=${JWT_SECRET:cambia-este-secreto-de-desarrollo-shelfy-32bytes}
shelfy.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

shelfy.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

shelfy.frontend-url=${FRONTEND_URL:http://localhost:4200}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Timeouts explícitos: sin esto, si el puerto SMTP está bloqueado/filtrado en
# vez de rechazado (p. ej. Render free bloquea los puertos 25/465/587 desde
# sep-2025), la conexión se queda colgada y bloquea la petición HTTP entera
# (register/forgot-password) durante minutos en vez de fallar rápido.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
shelfy.mail.enabled=${MAIL_ENABLED:false}
shelfy.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@shelfy.app}}

# Por defecto false (útil en local sin SMTP configurado). En Render free el
# puerto SMTP está bloqueado (ver comentario arriba), así que esto no puede
# activarse ahí sin cambiar antes a un proveedor de email por API (Resend,
# SendGrid...) o pasar a un plan de pago de Render.
shelfy.registration.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:false}

server.port=${PORT:8080}
server.error.include-message=always

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
